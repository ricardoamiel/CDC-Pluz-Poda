<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 600" width="1220" height="600" font-family="Arial, Helvetica, sans-serif"><defs><marker id="punta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4e5a6e"/></marker></defs><rect width="1220" height="600" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="700" fill="#131a26">Propuesta 1. En las instalaciones de Pluz</text><text x="24" y="56" font-size="13" fill="#4e5a6e">Lotes semanales con el mismo pipeline del repositorio, una base PostgreSQL y la página dentro de la red</text><rect x="24" y="90" width="200" height="96" rx="10" fill="#f4f7fc" stroke="#4e5a6e" stroke-width="1.3"/><text x="36" y="113" font-size="13" font-weight="700" fill="#131a26">Áreas de Pluz</text><text x="36" y="132" font-size="11.5" fill="#4e5a6e">Excel semanal de interrupciones,</text><text x="36" y="147" font-size="11.5" fill="#4e5a6e">poda, guía de subestaciones</text><text x="36" y="162" font-size="11.5" fill="#4e5a6e">y ranking de SAIDI</text><rect x="264" y="90" width="200" height="96" rx="10" fill="#f4f7fc" stroke="#4e5a6e" stroke-width="1.3"/><text x="276" y="113" font-size="13" font-weight="700" fill="#131a26">Carpeta compartida</text><text x="276" y="132" font-size="11.5" fill="#4e5a6e">OneDrive, SharePoint o</text><text x="276" y="147" font-size="11.5" fill="#4e5a6e">unidad de red; una carpeta</text><text x="276" y="162" font-size="11.5" fill="#4e5a6e">por lote, AAAAMMDD</text><rect x="504" y="90" width="200" height="96" rx="10" fill="#f4f7fc" stroke="#4e5a6e" stroke-width="1.3"/><text x="516" y="113" font-size="13" font-weight="700" fill="#131a26">Programador de tareas</text><text x="516" y="132" font-size="11.5" fill="#4e5a6e">de Windows, cada lunes</text><text x="516" y="147" font-size="11.5" fill="#4e5a6e">a primera hora</text><path d="M224,138 L262,138" fill="none" stroke="#4e5a6e" stroke-width="1.6" marker-end="url(#punta)"/><path d="M464,138 L502,138" fill="none" stroke="#4e5a6e" stroke-width="1.6" marker-end="url(#punta)"/><path d="M704,138 L742,138" fill="none" stroke="#4e5a6e" stroke-width="1.6" marker-end="url(#punta)"/><rect x="744" y="76" width="452" height="330" rx="14" fill="none" stroke="#395aa1" stroke-width="1.5" stroke-dasharray="6 5"/><text x="758" y="96" font-size="12" font-weight="700" fill="#395aa1">Pipeline en un servidor o PC de la Subgerencia</text><rect x="762" y="106" width="200" height="60" rx="10" fill="#e8eef8" stroke="#395aa1" stroke-width="1.3"/><circle cx="780" cy="125" r="10" fill="#395aa1"/><text x="780" y="129" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="796" y="129" font-size="13" font-weight="700" fill="#131a26">Validar el lote</text><text x="774" y="148" font-size="11.5" fill="#4e5a6e">contrato de columnas y archivos</text><rect x="978" y="106" width="200" height="60" rx="10" fill="#e8eef8" stroke="#395aa1" stroke-width="1.3"/><circle cx="996" cy="125" r="10" fill="#395aa1"/><text x="996" y="129" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="1012" y="129" font-size="13" font-weight="700" fill="#131a26">Base analítica</text><text x="990" y="148" font-size="11.5" fill="#4e5a6e">alimentador y mes, variables</text><rect x="762" y="182" width="200" height="60" rx="10" fill="#e8eef8" stroke="#395aa1" stroke-width="1.3"/><circle cx="780" cy="201" r="10" fill="#395aa1"/><text x="780" y="205" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="796" y="205" font-size="13" font-weight="700" fill="#131a26">Inferencia semanal</text><text x="774" y="224" font-size="11.5" fill="#4e5a6e">riesgo a 3 meses por alimentador</text><rect x="978" y="182" width="200" height="60" rx="10" fill="#fdf0d6" stroke="#ac5700" stroke-width="1.3"/><circle cx="996" cy="201" r="10" fill="#ac5700"/><text x="996" y="205" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="1012" y="205" font-size="13" font-weight="700" fill="#131a26">Entrenamiento mensual</text><text x="990" y="224" font-size="11.5" fill="#4e5a6e">con freno frente a la regla</text><rect x="762" y="258" width="200" height="60" rx="10" fill="#e8eef8" stroke="#395aa1" stroke-width="1.3"/><circle cx="780" cy="277" r="10" fill="#395aa1"/><text x="780" y="281" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="796" y="281" font-size="13" font-weight="700" fill="#131a26">Índice por distrito</text><text x="774" y="300" font-size="11.5" fill="#4e5a6e">dos niveles, plan del trimestre</text><rect x="978" y="258" width="200" height="60" rx="10" fill="#fdf0d6" stroke="#ac5700" stroke-width="1.3"/><text x="990" y="281" font-size="13" font-weight="700" fill="#131a26">MLflow</text><text x="990" y="300" font-size="11.5" fill="#4e5a6e">métricas y versiones de modelos</text><rect x="762" y="334" width="416" height="56" rx="10" fill="#e8eef8" stroke="#395aa1" stroke-width="1.3"/><circle cx="780" cy="353" r="10" fill="#395aa1"/><text x="780" y="357" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="796" y="357" font-size="13" font-weight="700" fill="#131a26">Salidas</text><text x="774" y="376" font-size="11.5" fill="#4e5a6e">data de la página, plan en Excel, reporte de la corrida</text><path d="M962,136 L976,136" fill="none" stroke="#4e5a6e" stroke-width="1.6" marker-end="url(#punta)"/><path d="M862,166 L862,180" fill="none" stroke="#4e5a6e" stroke-width="1.6" marker-end="url(#punta)"/><path d="M1078,166 L1078,180" fill="none" stroke="#4e5a6e" stroke-width="1.6" marker-end="url(#punta)"/><path d="M976,212 L964,212" fill="none" stroke="#4e5a6e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#punta)"/><path d="M862,242 L862,256" fill="none" stroke="#4e5a6e" stroke-width="1.6" marker-end="url(#punta)"/><path d="M1078,242 L1078,256" fill="none" stroke="#4e5a6e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#punta)"/><path d="M862,318 L862,332" fill="none" stroke="#4e5a6e" stroke-width="1.6" marker-end="url(#punta)"/><rect x="744" y="450" width="452" height="110" rx="10" fill="#e6f2e5" stroke="#3f7d33" stroke-width="1.3"/><text x="756" y="473" font-size="13" font-weight="700" fill="#131a26">PostgreSQL con PostGIS</text><text x="756" y="492" font-size="11.5" fill="#4e5a6e">Tablas que se reemplazan: interrupciones, poda, guía, ranking, base analítica.</text><text x="756" y="507" font-size="11.5" fill="#4e5a6e">Tablas que se acumulan: predicciones, índice por alimentador y por</text><text x="756" y="522" font-size="11.5" fill="#4e5a6e">subestación, y registro de corridas. Es el historial para medir aciertos.</text><text x="756" y="537" font-size="11.5" fill="#4e5a6e">Alternativa equivalente: SQL Server Express.</text><path d="M970,390 L970,448" fill="none" stroke="#4e5a6e" stroke-width="1.6" marker-end="url(#punta)"/><text x="970.0" y="413.0" font-size="11" fill="#4e5a6e" text-anchor="middle" font-style="normal">escribe</text><rect x="24" y="450" width="200" height="110" rx="10" fill="#e8eef8" stroke="#1d2f55" stroke-width="1.3"/><text x="36" y="473" font-size="13" font-weight="700" fill="#131a26">Página interna</text><text x="36" y="492" font-size="11.5" fill="#4e5a6e">la misma herramienta,</text><text x="36" y="507" font-size="11.5" fill="#4e5a6e">servida en IIS, nginx</text><text x="36" y="522" font-size="11.5" fill="#4e5a6e">o SharePoint</text><rect x="264" y="450" width="200" height="110" rx="10" fill="#e8eef8" stroke="#1d2f55" stroke-width="1.3"/><text x="276" y="473" font-size="13" font-weight="700" fill="#131a26">Plan en Excel</text><text x="276" y="492" font-size="11.5" fill="#4e5a6e">para programar las</text><text x="276" y="507" font-size="11.5" fill="#4e5a6e">cuadrillas del mes</text><rect x="504" y="450" width="200" height="110" rx="10" fill="#e8eef8" stroke="#1d2f55" stroke-width="1.3"/><text x="516" y="473" font-size="13" font-weight="700" fill="#131a26">Excel y Power BI</text><text x="516" y="492" font-size="11.5" fill="#4e5a6e">conectados a la base</text><text x="516" y="507" font-size="11.5" fill="#4e5a6e">para cruzar con sus</text><text x="516" y="522" font-size="11.5" fill="#4e5a6e">propias planillas</text><path d="M742,505 L706,505" fill="none" stroke="#4e5a6e" stroke-width="1.6" marker-end="url(#punta)"/><path d="M860,390 L860,420 L124,420 L124,448" fill="none" stroke="#4e5a6e" stroke-width="1.6" marker-end="url(#punta)"/><text x="492.0" y="414.0" font-size="11" fill="#4e5a6e" text-anchor="middle" font-style="normal">publica</text><path d="M760,390 L760,412 L364,412 L364,448" fill="none" stroke="#4e5a6e" stroke-width="1.6" marker-end="url(#punta)"/></svg>