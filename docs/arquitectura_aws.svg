<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" font-family="Arial, Helvetica, sans-serif"><defs><marker id="punta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4e5a6e"/></marker></defs><rect width="1240" height="700" fill="#ffffff"/><text x="24" y="34" font-size="20" font-weight="700" fill="#131a26">Propuesta 2. En AWS</text><text x="24" y="56" font-size="13" fill="#4e5a6e">Mismo flujo con piezas administradas: sin servidores encendidos y pago por uso</text><rect x="24" y="90" width="190" height="86" rx="10" fill="#f4f7fc" stroke="#4e5a6e" stroke-width="1.3"/><text x="36" y="113" font-size="13" font-weight="700" fill="#131a26">Áreas de Pluz</text><text x="36" y="132" font-size="11.5" fill="#4e5a6e">Excel y CSV semanales</text><rect x="244" y="90" width="210" height="86" rx="10" fill="#f4f7fc" stroke="#4e5a6e" stroke-width="1.3"/><text x="256" y="113" font-size="13" font-weight="700" fill="#131a26">Página de carga</text><text x="256" y="132" font-size="11.5" fill="#4e5a6e">enlace firmado de S3,</text><text x="256" y="147" font-size="11.5" fill="#4e5a6e">acceso con Cognito</text><rect x="484" y="90" width="220" height="86" rx="10" fill="#e6f2e5" stroke="#3f7d33" stroke-width="1.3"/><text x="496" y="113" font-size="13" font-weight="700" fill="#131a26">S3, zona cruda</text><text x="496" y="132" font-size="11.5" fill="#4e5a6e">archivos tal como llegan,</text><text x="496" y="147" font-size="11.5" fill="#4e5a6e">versionados, por lote</text><rect x="734" y="90" width="220" height="86" rx="10" fill="#f4f7fc" stroke="#4e5a6e" stroke-width="1.3"/><text x="746" y="113" font-size="13" font-weight="700" fill="#131a26">EventBridge</text><text x="746" y="132" font-size="11.5" fill="#4e5a6e">llegada de un archivo</text><text x="746" y="147" font-size="11.5" fill="#4e5a6e">o calendario de cada lunes</text><path d="M214,133 L242,133" fill="none" stroke="#4e5a6e" stroke-width="1.6" marker-end="url(#punta)"/><path d="M454,133 L482,133" fill="none" stroke="#4e5a6e" stroke-width="1.6" marker-end="url(#punta)"/><path d="M704,133 L732,133" fill="none" stroke="#4e5a6e" stroke-width="1.6" marker-end="url(#punta)"/><path d="M954,133 L1000,133 L1000,214" fill="none" stroke="#4e5a6e" stroke-width="1.6" marker-end="url(#punta)"/><text x="1000.0" y="167.5" font-size="11" fill="#4e5a6e" text-anchor="middle" font-style="normal">inicia</text><rect x="24" y="216" width="1192" height="300" rx="14" fill="none" stroke="#395aa1" stroke-width="1.5" stroke-dasharray="6 5"/><text x="38" y="236" font-size="12" font-weight="700" fill="#395aa1">AWS Step Functions orquesta cada corrida y se detiene si algo falla</text><rect x="44" y="250" width="220" height="86" rx="10" fill="#e8eef8" stroke="#395aa1" stroke-width="1.3"/><circle cx="62" cy="269" r="10" fill="#395aa1"/><text x="62" y="273" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="78" y="273" font-size="13" font-weight="700" fill="#131a26">Lambda: validar y convertir</text><text x="56" y="292" font-size="11.5" fill="#4e5a6e">contrato de datos; de Excel</text><text x="56" y="307" font-size="11.5" fill="#4e5a6e">a Parquet</text><rect x="294" y="250" width="230" height="86" rx="10" fill="#e6f2e5" stroke="#3f7d33" stroke-width="1.3"/><circle cx="312" cy="269" r="10" fill="#3f7d33"/><text x="312" y="273" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="328" y="273" font-size="13" font-weight="700" fill="#131a26">S3, zona curada</text><text x="306" y="292" font-size="11.5" fill="#4e5a6e">Parquet por fuente y lote,</text><text x="306" y="307" font-size="11.5" fill="#4e5a6e">catálogo de AWS Glue</text><rect x="554" y="250" width="230" height="86" rx="10" fill="#e8eef8" stroke="#395aa1" stroke-width="1.3"/><circle cx="572" cy="269" r="10" fill="#395aa1"/><text x="572" y="273" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="588" y="273" font-size="13" font-weight="700" fill="#131a26">Athena: tabla de variables</text><text x="566" y="292" font-size="11.5" fill="#4e5a6e">ingeniería de variables por</text><text x="566" y="307" font-size="11.5" fill="#4e5a6e">alimentador y mes, en SQL</text><rect x="814" y="250" width="380" height="86" rx="10" fill="#fdf0d6" stroke="#ac5700" stroke-width="1.3"/><circle cx="832" cy="269" r="10" fill="#ac5700"/><text x="832" y="273" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="848" y="273" font-size="13" font-weight="700" fill="#131a26">SageMaker: entrenamiento mensual</text><text x="826" y="292" font-size="11.5" fill="#4e5a6e">benchmark y reentrenamiento; Model Registry aprueba</text><text x="826" y="307" font-size="11.5" fill="#4e5a6e">solo si supera el freno; MLflow administrado</text><rect x="44" y="400" width="300" height="86" rx="10" fill="#e8eef8" stroke="#395aa1" stroke-width="1.3"/><circle cx="62" cy="419" r="10" fill="#395aa1"/><text x="62" y="423" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="78" y="423" font-size="13" font-weight="700" fill="#131a26">SageMaker: inferencia semanal</text><text x="56" y="442" font-size="11.5" fill="#4e5a6e">Batch Transform o Processing,</text><text x="56" y="457" font-size="11.5" fill="#4e5a6e">por lotes, con el modelo aprobado</text><rect x="374" y="400" width="260" height="86" rx="10" fill="#e8eef8" stroke="#395aa1" stroke-width="1.3"/><circle cx="392" cy="419" r="10" fill="#395aa1"/><text x="392" y="423" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="408" y="423" font-size="13" font-weight="700" fill="#131a26">Athena: tabla de inferencia</text><text x="386" y="442" font-size="11.5" fill="#4e5a6e">probabilidad por alimentador</text><text x="386" y="457" font-size="11.5" fill="#4e5a6e">y corte, con historial</text><rect x="664" y="400" width="260" height="86" rx="10" fill="#e8eef8" stroke="#395aa1" stroke-width="1.3"/><circle cx="682" cy="419" r="10" fill="#395aa1"/><text x="682" y="423" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">7</text><text x="698" y="423" font-size="13" font-weight="700" fill="#131a26">Lambda: índice y salidas</text><text x="676" y="442" font-size="11.5" fill="#4e5a6e">índice por distrito, plan</text><text x="676" y="457" font-size="11.5" fill="#4e5a6e">en Excel, reporte</text><rect x="954" y="400" width="240" height="86" rx="10" fill="#f4f7fc" stroke="#4e5a6e" stroke-width="1.3"/><text x="966" y="423" font-size="13" font-weight="700" fill="#131a26">SNS y CloudWatch</text><text x="966" y="442" font-size="11.5" fill="#4e5a6e">correo con el reporte,</text><text x="966" y="457" font-size="11.5" fill="#4e5a6e">alarmas si una etapa falla</text><path d="M264,293 L292,293" fill="none" stroke="#4e5a6e" stroke-width="1.6" marker-end="url(#punta)"/><path d="M524,293 L552,293" fill="none" stroke="#4e5a6e" stroke-width="1.6" marker-end="url(#punta)"/><path d="M784,293 L812,293" fill="none" stroke="#4e5a6e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#punta)"/><path d="M669,336 L669,372 L194,372 L194,398" fill="none" stroke="#4e5a6e" stroke-width="1.6" marker-end="url(#punta)"/><path d="M1004,336 L1004,356 L300,356 L300,398" fill="none" stroke="#4e5a6e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#punta)"/><path d="M344,443 L372,443" fill="none" stroke="#4e5a6e" stroke-width="1.6" marker-end="url(#punta)"/><path d="M634,443 L662,443" fill="none" stroke="#4e5a6e" stroke-width="1.6" marker-end="url(#punta)"/><path d="M924,443 L952,443" fill="none" stroke="#4e5a6e" stroke-width="1.6" marker-end="url(#punta)"/><rect x="484" y="560" width="330" height="100" rx="10" fill="#e8eef8" stroke="#1d2f55" stroke-width="1.3"/><text x="496" y="583" font-size="13" font-weight="700" fill="#131a26">S3 y CloudFront: la página</text><text x="496" y="602" font-size="11.5" fill="#4e5a6e">sitio estático con acceso restringido</text><text x="496" y="617" font-size="11.5" fill="#4e5a6e">por Cognito o por las IP de Pluz;</text><text x="496" y="632" font-size="11.5" fill="#4e5a6e">datos de la herramienta en JSON</text><rect x="844" y="560" width="350" height="100" rx="10" fill="#e8eef8" stroke="#1d2f55" stroke-width="1.3"/><text x="856" y="583" font-size="13" font-weight="700" fill="#131a26">Consumo</text><text x="856" y="602" font-size="11.5" fill="#4e5a6e">Subgerencia: página y plan en Excel;</text><text x="856" y="617" font-size="11.5" fill="#4e5a6e">analistas: Athena desde Excel o</text><text x="856" y="632" font-size="11.5" fill="#4e5a6e">Power BI con el conector ODBC</text><rect x="24" y="560" width="430" height="100" rx="10" fill="#f4f7fc" stroke="#4e5a6e" stroke-width="1.3"/><text x="36" y="583" font-size="13" font-weight="700" fill="#131a26">Seguridad y costo</text><text x="36" y="602" font-size="11.5" fill="#4e5a6e">buckets privados con cifrado KMS, IAM mínimo,</text><text x="36" y="617" font-size="11.5" fill="#4e5a6e">registro con CloudTrail; sin endpoints encendidos:</text><text x="36" y="632" font-size="11.5" fill="#4e5a6e">se paga solo por los minutos de cada corrida</text><path d="M794,486 L794,520 L649,520 L649,558" fill="none" stroke="#4e5a6e" stroke-width="1.6" marker-end="url(#punta)"/><text x="721.5" y="514.0" font-size="11" fill="#4e5a6e" text-anchor="middle" font-style="normal">publica</text><path d="M814,610 L842,610" fill="none" stroke="#4e5a6e" stroke-width="1.6" marker-end="url(#punta)"/></svg>